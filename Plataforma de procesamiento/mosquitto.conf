# ============================================================
#  mosquitto.conf — Configuración Mosquitto v2.1.2
#  En Mosquitto v2+ es OBLIGATORIO definir un listener
#  y allow_anonymous explícitamente. Sin este archivo
#  el broker rechaza todas las conexiones.
# ============================================================

# Listener principal MQTT
listener 1883
allow_anonymous true

# Listener WebSocket (para MQTTX web o dashboards)
listener 9001
protocol websockets
allow_anonymous true

# Persistencia de mensajes retain entre reinicios
persistence true
persistence_location /mosquitto/data/

# Log
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
