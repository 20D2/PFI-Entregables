# ============================================================
#  Docker Compose — Stack IoT GPON
#  Proyecto Final Ingeniería Electrónica
#
#  Servicios:
#    - Mosquitto  v2.1.2   (broker MQTT)       → puerto 1883
#    - Node-RED   v5.0.7   (lógica y flujos)   → puerto 1880
#    - InfluxDB   v1.8     (base de datos)      → puerto 8086
#    - Grafana    v13.2.1  (dashboard)          → puerto 3000
#
#  Uso:
#    docker compose up -d          → levantar todo en background
#    docker compose down           → detener y eliminar contenedores
#    docker compose logs -f        → ver logs en tiempo real
#    docker compose restart nodered → reiniciar un servicio solo
# ============================================================

services:

  # ── MOSQUITTO — Broker MQTT ────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT estándar (ESP32 y Node-RED)
      - "9001:9001"     # WebSocket (opcional, para MQTTX web)
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - gpon_iot

  # ── NODE-RED — Lógica y flujos ─────────────────────────────
  nodered:
    image: nodered/node-red:5.0.7-24
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./nodered/data:/data
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - gpon_iot

  # ── INFLUXDB — Base de datos de series temporales ──────────
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=gpon_iot                  # base de datos principal
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=********
      - INFLUXDB_USER=nodered                 # usuario para Node-RED
      - INFLUXDB_USER_PASSWORD=********
      - INFLUXDB_HTTP_AUTH_ENABLED=false      # sin auth para desarrollo local
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./influxdb/data:/var/lib/influxdb
    networks:
      - gpon_iot

    # ── GRAFANA — Dashboard visual ─────────────────────────────
  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=********
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=usuario@ejemplo.com
      - GF_SMTP_PASSWORD=********
      - GF_SMTP_FROM_ADDRESS=usuario@ejemplo.com
      - GF_SMTP_FROM_NAME=Grafana GPON IoT
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      - GF_INSTALL_PLUGINS=
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
    networks:
      - gpon_iot

# ── Red interna ────────────────────────────────────────────────
#  Todos los contenedores se comunican entre sí usando el
#  nombre del servicio como hostname. Ejemplos:
#    Node-RED → broker MQTT:  mosquitto:1883
#    Node-RED → InfluxDB:     influxdb:8086
#    Grafana  → InfluxDB:     influxdb:8086
networks:
  gpon_iot:
    driver: bridge
